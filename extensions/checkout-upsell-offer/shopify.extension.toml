# Learn more about configuring your checkout UI extension:
# https://shopify.dev/docs/api/checkout-ui-extensions/latest/configuration

api_version = "2026-07"

[[extensions]]
name = "checkout-upsell-offer"
handle = "checkout-upsell-offer"
uid = "fefeacce-836a-4eab-a9b2-e63eee335e30d0b0bb45"
type = "ui_extension"

[[extensions.targeting]]
module = "./src/Checkout.jsx"
target = "purchase.checkout.block.render"

[[extensions.targeting]]
module = "./src/Checkout.jsx"
target = "purchase.checkout.cart-line-list.render-after"

[[extensions.targeting]]
module = "./src/Checkout.jsx"
target = "purchase.thank-you.block.render"

[extensions.capabilities]
api_access = true

[extensions.settings]
[[extensions.settings.fields]]
key = "show_offer"
type = "boolean"
name = "Enable product offer"
description = "Show or hide this complementary product upsell"

[[extensions.settings.fields]]
key = "offer_heading"
type = "single_line_text_field"
name = "Offer headline"
description = "Section title (e.g. Complete Your Order, Special Add-On)"

[[extensions.settings.fields]]
key = "offer_subheading"
type = "single_line_text_field"
name = "Offer subtitle"
description = "Short promotional subtitle displayed below the headline"

[[extensions.settings.fields]]
key = "offer_badge_text"
type = "single_line_text_field"
name = "Badge label"
description = "Tag text next to the title (e.g. Complementary, Best Value, 20% OFF)"

[[extensions.settings.fields]]
key = "featured_variant"
type = "variant_reference"
name = "Featured product variant"
description = "Select a specific product variant to recommend, or leave blank to automatically offer store catalog items"
